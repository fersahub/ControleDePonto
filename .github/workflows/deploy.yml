name: Publicar Controle de Ponto

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy.yml"
      - "README.md"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          node --check assets/js/time-engine.js
          node --check assets/js/schedule-engine.js
          node --check assets/js/app.js
      - name: Teste estrutural do site
        run: node tests/smoke-test.js
      - name: Testes de cálculos e jornadas
        run: node tests/core-tests.js
      - name: Testes dos ciclos de escala
        run: node tests/schedule-tests.js
      - name: Instalar navegador para testes
        run: |
          mkdir -p /tmp/controle-ponto-tests
          cd /tmp/controle-ponto-tests
          npm init -y
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testes de interface no navegador
        run: NODE_PATH=/tmp/controle-ponto-tests/node_modules node tests/browser-tests.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar publicação no GitHub Pages
        id: pages-smoke
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "${PAGE_URL}" -o /tmp/controle-ponto-home.html && grep -q "Meu controle de jornada" /tmp/controle-ponto-home.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "A página publicada não respondeu com o conteúdo esperado."
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error --location "${PAGE_URL%/}/assets/js/time-engine.js" | node --check
          curl --fail --silent --show-error --location "${PAGE_URL%/}/assets/js/app.js" | node --check
          curl --fail --silent --show-error --location "${PAGE_URL%/}/manifest.webmanifest" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(!m.icons.some(i=>i.sizes==='192x192')||!m.icons.some(i=>i.sizes==='512x512'))process.exit(1);})"
      - name: Registrar resultado da homologação da publicação
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_CHECK: ${{ steps.pages-smoke.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const state = process.env.DEPLOY_CHECK === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "pages/deployment-smoke-test",
              description: state === "success"
                ? "GitHub Pages respondeu com o conteúdo e arquivos esperados."
                : "A verificação pós-publicação do GitHub Pages falhou.",
              target_url: process.env.PAGE_URL || `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
